<title>Étape 2 test · Home and people · Édito A2</title><style>:root{
  --bg:#f7f8f6; --panel:#ffffff; --ink:#1f2a2b; --muted:#66706f; --line:#dfe5e2;
  --accent:#0f7b6c; --accent-2:#0a5c51; --accent-soft:#dcf2ee;
  --bleu:#2b59c3; --rouge:#d62839;
  --good:#2f8a4f; --good-soft:#dff3e5; --bad:#c2402a; --bad-soft:#fbe3de;
  --m:#2f6db5; --m-soft:#e2eefb; --f:#c2185b; --f-soft:#fbe3ee; --pl:#7b4fb5; --pl-soft:#efe6fb;
  --radius:14px; --shadow:0 1px 2px rgba(20,40,40,.06),0 4px 14px rgba(20,40,40,.07);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --serif:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a1a; --panel:#1d2525; --ink:#e9f0ee; --muted:#9fb0ac; --line:#304040;
  --accent:#3fbfa8; --accent-2:#7fe0cc; --accent-soft:#183731;
  --good:#5cc27f; --good-soft:#1d3324; --bad:#ef7a64; --bad-soft:#3d221d;
  --m:#7fb0ef; --m-soft:#1e2b3b; --f:#f07aa8; --f-soft:#3a2030; --pl:#b896ee; --pl-soft:#2c2340;
  --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-2)}
.fr{font-weight:600;line-height:1.4}
.pr{color:var(--muted);font-style:italic;font-size:14px}
.en{color:var(--muted)}
body.no-pr .pr{display:none} body.no-en .en{display:none}
b.say{color:var(--accent-2);cursor:pointer;border-bottom:1px dotted var(--accent)}
b.say:hover{background:var(--accent-soft)}
/* gender colours (switchable) */
.g-m{color:var(--m)!important} .g-f{color:var(--f)!important} .g-pl{color:var(--pl)!important}
b.say.g-m{border-bottom-color:var(--m)} b.say.g-f{border-bottom-color:var(--f)} b.say.g-pl{border-bottom-color:var(--pl)}
body.no-gc .g-m,body.no-gc .g-f,body.no-gc .g-pl{color:inherit!important}
.gdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:-3px}.gdot.m{background:var(--m)}.gdot.f{background:var(--f)}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--bleu) 33.3%,#fff 33.3% 66.6%,var(--rouge) 66.6%)}
.top-inner{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand small{color:var(--muted);font-size:12px}
.brand b{font-size:17px}
.toggles{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2);font-weight:600}
.progress{height:4px;background:var(--line)} .progress>div{height:100%;background:var(--accent);transition:width .4s}
nav.tabs{max-width:1080px;margin:0 auto;padding:8px 12px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:10px 10px 0 0;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.active{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
nav.tabs a .tick{color:var(--good);margin-inline-start:4px}

main{max-width:1080px;margin:0 auto;padding:18px 16px 80px}
h2{margin:6px 0 4px;font-size:24px} h3{margin:18px 0 8px;font-size:18px}
.h2en{font-size:16px;font-weight:400}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.small{padding:4px 10px;font-size:13px}
.play{border:none;background:var(--accent-soft);color:var(--accent-2);width:34px;height:34px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:14px;vertical-align:middle}
.play:hover{background:var(--accent);color:#fff}
.play.speaking{background:var(--accent);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.done-btn{margin-top:22px}
.muted{color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 16px}

/* illustrations */
.scene-svg{width:100%;height:auto;display:block;border-radius:12px}
.scene-wrap{margin:10px 0 4px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.actor .bob{transform-box:fill-box;transform-origin:50% 100%}
.actor.talking .bob{animation:talk .55s ease-in-out infinite alternate}
@keyframes talk{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.actor.talking{filter:drop-shadow(0 0 6px rgba(255,205,0,.9))}
.av{flex:none;border-radius:50%}

/* overview */
.hero2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:center;padding:12px}
.hero-art{border-radius:12px;overflow:hidden}
.hero-txt .fr.big{font-family:var(--serif);font-size:32px;color:var(--accent-2);line-height:1.2;margin:6px 0}
.rub-badge{display:inline-block;color:#fff;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700;letter-spacing:.03em}
.r1{background:#0f7b6c}.r2{background:#2b59c3}.r3{background:#b5652b}.r4{background:#a3407e}.r5{background:#5b4fb5}.r6{background:#c0392b}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.glance{display:flex;flex-direction:column;gap:10px}
.gl{display:flex;gap:10px;align-items:flex-start}.gl-ic{font-size:24px;width:34px;text-align:center}
.goals li{margin:4px 0}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.path a{text-decoration:none;color:var(--ink)}
.path .step{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;gap:10px;align-items:center;line-height:1.25}
.path .step.done{border-color:var(--good);background:var(--good-soft)}
.path .num{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.path .done .num{background:var(--good);color:#fff}

/* dialogue */
.dlg-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.dtitle{font-size:20px;font-family:var(--serif)}
.sit-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px}
.sit-n:empty{display:none}
.bubbles{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bub{display:flex;gap:10px;align-items:flex-start;max-width:88%}
.bub.right{align-self:flex-end;flex-direction:row-reverse}
.bub .body{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer;transition:background .2s}
.bub .who{font-size:12px;color:var(--muted);font-weight:600}
.bub .fr.line{font-size:19px;display:block}
.bub.active .body{background:var(--accent-soft);border-color:var(--accent)}
.bub.m .who{color:var(--m)} .bub.f .who{color:var(--f)}
.stage-dir{align-self:center;font-style:italic;color:var(--muted);font-size:14px;background:var(--bg);border-radius:999px;padding:2px 14px}
.hidetext .bub .fr.line,.hidetext .bub .en{filter:blur(7px)} .hidetext .bub.revealed .fr.line,.hidetext .bub.revealed .en{filter:none}
.roleplay .bub.mine:not(.revealed) .fr.line,.roleplay .bub.mine:not(.revealed) .en{filter:blur(7px)}
.roleplay .bub.mine .body{border:2px dashed var(--accent)}
.shadow-cue{font-size:14px;color:var(--accent-2);font-weight:700;min-height:22px;margin-top:6px}
.dgloss{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.gchip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px;cursor:pointer;background:var(--bg)}

/* vocabulary */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.picdict{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.picdict.small{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.pd{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-top:5px solid var(--line);border-radius:14px;background:var(--panel);padding:10px 6px;text-align:center;box-shadow:var(--shadow);transition:transform .15s}
.pd:hover{transform:translateY(-2px)}
.pd .pd-pic{font-size:42px;line-height:1.15}
.picdict.small .pd .pd-pic{font-size:34px}
.pd .fr{font-size:16px}.pd .en{font-size:12px}
.pd-m{border-top-color:var(--m)}.pd-f{border-top-color:var(--f)}.pd-pl{border-top-color:var(--pl)}
body.no-gc .pd{border-top-color:var(--line)}
.vcard{display:flex;flex-direction:column;gap:2px;position:relative;cursor:pointer;border-left:5px solid var(--line)}
.vc-m{border-left-color:var(--m)}.vc-f{border-left-color:var(--f)}.vc-pl{border-left-color:var(--pl)}
.vcard .pic{font-size:30px;line-height:1.2}
.vcard .fr{font-size:20px}
.vcard .play{position:absolute;top:12px;right:12px}
.vcard .box{position:absolute;top:54px;right:14px;font-size:11px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;background:var(--accent-soft);color:var(--accent-2);border-radius:6px;padding:1px 6px;margin-top:4px;width:max-content}
.g-tag-m{background:var(--m-soft);color:var(--m)}.g-tag-f{background:var(--f-soft);color:var(--f)}.g-tag-pl{background:var(--pl-soft);color:var(--pl)}
.flash-wrap{max-width:440px;margin:0 auto;text-align:center}
.flash{perspective:1000px;height:270px;cursor:pointer;margin:10px 0}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:18px;border:1px solid var(--line);border-top:8px solid var(--line);background:var(--panel);box-shadow:var(--shadow);padding:16px}
.flash.gb-m .face{border-top-color:var(--m)}.flash.gb-f .face{border-top-color:var(--f)}.flash.gb-pl .face{border-top-color:var(--pl)}
.flash .back{transform:rotateY(180deg);background:var(--accent-soft)}
.flash .fr{font-size:32px}
.flash .pic{font-size:50px}

/* grammar + infographics */
.gblock h3{margin-top:0;font-size:20px}
.gblock p{margin:8px 0}
.after{border-top:1px dashed var(--line);margin-top:12px}
table.g{border-collapse:collapse;width:100%;margin-top:10px}
table.g td,table.g th{border-bottom:1px solid var(--line);padding:8px;text-align:left}
table.g td.frcell{font-size:18px;white-space:nowrap}
figure.info{margin:14px 0;padding:14px;border-radius:14px;background:linear-gradient(180deg,var(--bg),var(--panel));border:1px solid var(--line)}
figure.info figcaption{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-2);font-weight:800;margin-bottom:10px}
.gnote{margin-top:10px;font-size:14px;background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.schip{display:inline-block;margin:3px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;cursor:pointer;font-weight:600}
.schip .en{font-weight:400;font-size:13px}
.end{color:var(--rouge);font-weight:800}
/* gender columns */
.gcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.gcol{border-radius:12px;padding:10px;border:2px solid}
.gc-m{border-color:var(--m);background:var(--m-soft)}.gc-f{border-color:var(--f);background:var(--f-soft)}.gc-pl{border-color:var(--pl);background:var(--pl-soft)}
.ghead{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.gbadge{font-family:var(--serif);font-size:22px;font-weight:800;border-radius:10px;padding:0 10px;color:#fff}
.gc-m .gbadge{background:var(--m)}.gc-f .gbadge{background:var(--f)}.gc-pl .gbadge{background:var(--pl)}
/* merges */
.merges{display:flex;flex-direction:column;gap:8px}
.mrow,.eq{display:flex;gap:6px;align-items:center;flex-wrap:wrap;cursor:pointer}
.eq{justify-content:center;margin:12px 0 0}
.mb{display:inline-grid;place-items:center;min-width:48px;padding:4px 10px;border-radius:10px;font-weight:800;font-size:18px;color:#fff;font-family:var(--serif)}
.mb-p{background:#555}.mb-m{background:var(--m)}.mb-f{background:var(--f)}.mb-pl{background:var(--pl)}.mb-x{background:#888}
.mb-r{background:var(--panel);color:var(--ink);border:2px dashed var(--muted)}
.mb-r.fused{background:var(--rouge);color:#fff;border:2px solid var(--rouge);box-shadow:0 0 0 4px rgba(214,40,57,.15)}
.op{font-weight:800;color:var(--muted);font-size:18px}
.mex{margin-left:8px}
.nomerge .mb-r{opacity:.9}
/* scale */
.scale{position:relative;height:196px;margin:0 50px}
.sbar{position:absolute;left:0;right:0;top:80px;height:12px;border-radius:6px}
.smark{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;width:120px;font-size:14px;line-height:1.2}
.smark.up{top:0;justify-content:flex-end;height:78px}
.smark.dn{top:94px}
.smark .spic{font-size:20px}
.smark.up::after{content:"";width:2px;height:8px;background:var(--muted)}
.smark.dn::before{content:"";width:2px;height:8px;background:var(--muted)}
.smark .en{font-size:12px}
.sends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}
/* ladder */
.ladder{display:flex;flex-direction:column;gap:8px}
.rung{display:flex;gap:10px;align-items:center;border-left:6px solid;border-radius:10px;background:var(--panel);padding:6px 10px}
.rname{color:#fff;border-radius:8px;padding:2px 10px;font-weight:700;display:flex;flex-direction:column;line-height:1.2;min-width:96px}
.rname small{font-weight:400;opacity:.85}
/* conjugation */
.conj{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cverb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.cinf{background:var(--accent);color:#fff;padding:6px 10px;cursor:pointer}.cinf .fr{color:#fff;font-size:18px}.cinf .en{color:#e8fffa}
.cform{display:flex;gap:8px;padding:4px 10px;border-top:1px solid var(--line);cursor:pointer}
.cform:hover{background:var(--accent-soft)}
.cform .cp{color:var(--muted);width:64px;flex:none;font-size:13px;padding-top:2px}
.cform .fr{font-size:17px}
.qzbox{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
/* compare */
.cmp{display:grid;gap:10px}
.cmpcol{border:2px solid;border-radius:12px;overflow:hidden;background:var(--panel)}
.cmphead{color:#fff;font-weight:800;padding:6px 10px;font-size:18px;font-family:var(--serif);display:flex;flex-direction:column;line-height:1.2}
.cmphead small{font-family:var(--ui);font-weight:400;font-size:12px;opacity:.9}
.cmppic{text-align:center;padding:6px}.cmppic.emo{font-size:46px}
.cmplines{padding:4px 10px 10px}.cl{padding:3px 0;cursor:pointer;display:flex;flex-direction:column}.cl .en{font-size:13px}
@media (max-width:640px){.cmp{grid-template-columns:1fr!important}}
/* documents */
.doc-fig{display:flex;flex-direction:column;align-items:center}
.doc{width:min(100%,420px);border-radius:10px;padding:16px 18px;box-shadow:0 6px 20px rgba(0,0,0,.18);position:relative}
.doc-title{font-weight:800;font-size:20px;text-align:center}
.doc-sub{text-align:center;font-size:13px;opacity:.8;margin-bottom:6px}
.doc-row{display:flex;gap:6px;align-items:baseline;padding:3px 0;cursor:pointer}
.doc-row .dots{flex:1;border-bottom:2px dotted currentColor;opacity:.35}
.doc-foot{text-align:center;font-size:13px;margin-top:8px;opacity:.85}
.doc-chalk{background:#2c3a2f;color:#f2f2e8;font-family:"Comic Sans MS","Chalkboard SE",cursive;border:8px solid #8a5a2b}
.doc-board{background:#111;color:#ffcd00;font-family:ui-monospace,Menlo,monospace}.doc-board .doc-title{color:#fff;letter-spacing:.2em}
.doc-ticket{background:#fffbe8;color:#222;border:2px dashed #b99a2b;font-family:ui-monospace,Menlo,monospace}
.doc-receipt{background:#fff;color:#222;font-family:ui-monospace,Menlo,monospace;clip-path:polygon(0 0,100% 0,100% 96%,95% 100%,90% 96%,85% 100%,80% 96%,75% 100%,70% 96%,65% 100%,60% 96%,55% 100%,50% 96%,45% 100%,40% 96%,35% 100%,30% 96%,25% 100%,20% 96%,15% 100%,10% 96%,5% 100%,0 96%)}
.doc-menu{background:#fdf6e3;color:#3a2a1e;font-family:var(--serif);border:3px double #7a3b1d}
.doc-form{background:#fff;color:#222;border:1px solid #bbb;border-top:10px solid var(--bleu)}
.doc-label{background:#fff8d6;color:#3a2a1e;border:2px solid #e0b100;border-radius:16px}
/* minis + pattern */
.minis{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.minic{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);cursor:pointer;min-width:120px}
.minic .en{font-size:12px}
.pattern{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pfix{background:var(--accent);color:#fff;border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer}
.pslot{display:inline-flex;flex-direction:column;border:2px dashed var(--accent);border-radius:10px;padding:2px 8px;font-weight:600}
.pslot span{cursor:pointer;padding:1px 0}.pslot span:hover{text-decoration:underline}
/* flow (conversation map) */
.flow{position:relative;display:flex;flex-direction:column;gap:6px}
.flow::before{content:"";position:absolute;left:50%;top:44px;bottom:6px;width:3px;background:var(--line);transform:translateX(-50%)}
.lane-heads{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.lane-heads span{display:flex;gap:6px;align-items:center}
.fstep{display:flex;position:relative}
.fstep.l{justify-content:flex-start}.fstep.r{justify-content:flex-end}
.fcard{width:calc(50% - 22px);display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;box-shadow:var(--shadow)}
.fstep.l .fcard{border-left:5px solid var(--bleu)}.fstep.r .fcard{border-right:5px solid var(--rouge)}
.fn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.fcard .en{font-size:13px}.fcard .alt{font-size:12px;color:var(--muted);margin-top:2px}
@media (max-width:640px){.flow::before{display:none}.fcard{width:92%}}

/* widgets */
.widget{margin-top:14px;padding:14px;border-radius:12px;background:var(--bg);border:2px dashed var(--accent)}
.widget .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-2);font-weight:800;margin-bottom:8px}
.result{font-size:40px;text-align:center;margin:8px 0;min-height:60px}
.cap{font-size:15px}
.spool{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.scols{display:grid;gap:8px}
.scol2{border:2px solid;border-radius:12px;min-height:110px;cursor:pointer;background:var(--panel);overflow:hidden}
.sch{color:#fff;font-weight:700;padding:4px 10px;text-align:center}
.sin{display:flex;flex-wrap:wrap;gap:4px;padding:6px}
.tile.small{font-size:14px;padding:1px 8px}
.pricetag{display:flex;justify-content:center;margin:6px 0}
.pt-num{background:#ffcd00;color:#1f2a2b;font-weight:800;font-size:34px;padding:4px 22px 4px 30px;border-radius:6px 30px 30px 6px;position:relative;font-family:var(--serif)}
.pt-num::before{content:"";position:absolute;left:10px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.money{display:inline-flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:4px 0}
.note{display:inline-grid;place-items:center;width:54px;height:30px;border-radius:4px;font-size:12px;font-weight:800;color:#fff}
.n50{background:#e07b39}.n20{background:#3b78c2}.n10{background:#c0392b}.n5{background:#7f8c8d}
.coin{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:radial-gradient(#f5d68a,#c9a227);font-size:10px;font-weight:800;color:#5a4400;border:2px solid #b0901a}
.coin.small{width:24px;height:24px;background:radial-gradient(#e8b48a,#b5652b);color:#fff;border-color:#8a4a1a;font-size:9px}
.clockrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.ck-big{font-size:36px;font-weight:800;font-family:ui-monospace,Menlo,monospace}
.ck-words .fr{font-size:20px}

/* expressions */
.xhead{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:17px}
.xic{font-size:26px}
.xitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.xitem{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;background:var(--bg)}
.xitem:hover{border-color:var(--accent)}
.xitem .fr{font-size:17px}.xitem .en{font-size:13px}
.reg{font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px;display:flex;flex-direction:column;align-items:center;line-height:1.15;flex:none}
.reg small{font-weight:400;font-size:10px}
.reg-poli{background:#e2eefb;color:#2b59c3}.reg-std{background:#e5f4e8;color:#2f8a4f}.reg-fam{background:#fdecd8;color:#b5652b}.reg-sout{background:#efe6fb;color:#7b4fb5}
.xreply{margin-top:8px;font-size:14px;color:var(--muted)}

/* sounds */
.letter{display:flex;gap:14px}
.letter .glyph{font-size:30px;font-weight:800;line-height:1.1;min-width:90px;height:80px;padding:0 8px;display:grid;place-items:center;border-radius:16px;background:var(--accent-soft);color:var(--accent-2);flex:none;cursor:pointer;text-align:center;font-family:var(--serif)}
.ex{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 12px;margin:3px;cursor:pointer;background:var(--panel)}
.ex .fr{font-size:17px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.pair .side{text-align:center;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--panel)}
.pair .side .fr{font-size:26px;display:block}
.vs{color:var(--muted);font-size:12px;text-align:center;max-width:160px}

/* quiz */
.quiz{max-width:680px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}
.qtag{background:var(--accent-soft);color:var(--accent-2);border-radius:6px;padding:0 6px;font-weight:600}
.qbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:14px}.qbar>div{height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:18px;font-weight:600;margin-bottom:10px}
.qpic{font-size:54px;text-align:center}
.qsentence{font-size:24px;text-align:center;margin:10px 0}
.qsentence .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);color:var(--accent-2)}
.opts{display:grid;gap:8px}
.opt{text-align:start;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:12px;padding:10px 14px;border-radius:12px;font-size:15px}
.feedback.good{background:var(--good-soft);color:var(--good)} .feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback .ex-text{color:var(--ink);display:block;margin-top:4px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;padding:8px;border-radius:12px}
.tiles.lines{flex-direction:column;align-items:stretch}.tiles.lines .tile{text-align:left;font-size:16px}
.tiles.answer{border:2px dashed var(--line);margin-bottom:8px}
.tile{font-size:18px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:2px 14px}
.big-play{width:72px;height:72px;font-size:28px;margin:6px auto 14px;display:grid}
.score{font-size:48px;font-weight:800;text-align:center;color:var(--accent-2)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .mi{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px;text-align:center;min-height:52px}
.match .mi .fr{font-size:17px}
.match .mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.match .mi.ok{border-color:var(--good);background:var(--good-soft);opacity:.55}
.match .mi.no{border-color:var(--bad);background:var(--bad-soft)}
.tin{font:inherit;font-size:18px;padding:8px 10px;border-radius:10px;border:2px solid var(--accent);background:var(--panel);color:var(--ink);min-width:120px}
.tin.ok{border-color:var(--good);background:var(--good-soft)} .tin.no{border-color:var(--bad);background:var(--bad-soft)}
.frkeys{margin:8px 0}.frkeys .chip{font-size:16px;font-weight:700;padding:3px 11px}

/* role-play */
.rp{display:flex;flex-direction:column;gap:10px}
.rp-body{display:flex;flex-direction:column;gap:10px}
.memo{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.memo span{background:#fff8d6;color:#5a4400;border:1px solid #e0b100;border-radius:6px;padding:1px 8px;font-size:13px;transform:rotate(-1deg)}
.yourturn{background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.rec{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}

/* culture */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ccard{display:flex;gap:12px;border-top:5px solid var(--bleu)}
.ccard:nth-child(3n+2){border-top-color:var(--rouge)}.ccard:nth-child(3n){border-top-color:var(--accent)}
.cic{font-size:34px;flex:none}
.ckind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tipcard{display:flex;gap:12px}
.tipcard .ic{font-size:28px;flex:none}
.mist{display:flex;flex-direction:column;gap:6px}
.mrow2{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.no-say{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.yes-say{color:var(--good);cursor:pointer}
@media (max-width:640px){.mrow2{grid-template-columns:1fr}}

/* tests */
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.ok{border-color:var(--good);background:var(--good-soft)}
.tile.no{border-color:var(--bad);background:var(--bad-soft)}
.titems{padding-inline-start:22px;margin:6px 0} .titems li{margin:10px 0}
.qsent .fr{font-size:17px}
.qsent select{font-size:16px;max-width:100%;padding:2px 6px;border-radius:8px;border:2px solid var(--accent);background:var(--panel);color:var(--ink);margin:0 4px}
.qsent select.ok{border-color:var(--good);background:var(--good-soft)} .qsent select.no{border-color:var(--bad);background:var(--bad-soft)}
.blank{display:inline-block;min-width:60px;border-bottom:2px solid var(--accent);color:var(--accent-2);text-align:center}
.fb{font-size:14px;margin-top:2px}
.markbox{border:2px solid var(--accent);border-radius:10px;min-width:56px;text-align:center;display:flex;flex-direction:column;line-height:1.2;padding:4px}
.markbox .got{font-weight:800;font-size:18px;color:var(--accent-2);border-bottom:1px solid var(--line)} .markbox .of{font-size:13px;color:var(--muted)}
.tsec.full{border-color:var(--good)} .tsec.part{border-color:var(--accent)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 20px}
.tgrid .qsent{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tgrid .tin{min-width:0;width:140px;font-size:16px;padding:4px 8px}
.mini{background:var(--bg);border-radius:10px;padding:8px 12px;border:1px solid var(--line)}
.opt-l{font-size:16px;text-align:left}

/* course home */
.home-hero{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:center}
.home-hero h1{font-family:var(--serif);font-size:34px;margin:0;line-height:1.15;color:var(--accent-2)}
.rubrique{margin-top:26px}
.rubrique h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rnum{color:#fff;border-radius:10px;padding:0 12px;font-family:var(--serif)}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.lesson-link{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink)}
.lesson-link .n{font-size:22px;font-weight:800;color:var(--accent-2);width:40px;text-align:center;flex:none}
.lesson-link .thumb{width:120px;flex:none;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.lesson-link .frt{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--accent-2)}
.lesson-link:hover{border-color:var(--accent)}
.soon{opacity:.55}
.soon .frt{color:var(--muted)}
.test-link{border-color:var(--accent);background:var(--accent-soft)}

@media (max-width:760px){
  .brand{flex-basis:100%}
  .toggles{width:100%}
  .hero2,.ov-grid,.home-hero{grid-template-columns:1fr}
  .bub{max-width:100%}
  .bub .fr.line{font-size:17px}
  .flash{height:240px}
  .lesson-link .thumb{width:84px}
}

.speedbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0 4px;font-size:13px}
.speedbar .chip{padding:3px 10px}

/* ===== Édito A1 additions ===== */
:root{--unit:#0f7b6c}
.opener{margin-top:10px;font-family:var(--serif);font-size:19px;background:var(--panel);border-left:5px solid var(--unit);border-radius:8px;padding:8px 12px;cursor:pointer;box-shadow:var(--shadow)}
.opener .en{display:block;font-family:var(--ui);font-size:13px}
.sits{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.sit{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--unit);border-radius:12px;padding:10px 12px}
.sit-ic{font-size:28px}
/* maps */
.map-fig .mapwrap{background:#f3efe6;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.map-svg,.metro-svg{width:100%;height:auto;display:block}
.map-svg .route{animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-34}}
.map-svg .mplace{cursor:pointer}.map-svg .mplace:hover circle{fill:#fff3c4}
.map-svg .pulse{animation:pulse 1.6s ease-out infinite;transform-origin:center}
@keyframes pulse{0%{opacity:1;r:9}100%{opacity:0;r:22}}
.metro-svg .mstation{cursor:pointer}
.msteps{margin:10px 0 0;padding:0;list-style:none;counter-reset:st;display:grid;gap:6px}
.msteps li{counter-increment:st;display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;background:var(--panel)}
.msteps li::before{content:counter(st);flex:none;width:24px;height:24px;border-radius:50%;background:var(--rouge);color:#fff;font-weight:800;display:grid;place-items:center;font-size:13px}
.msteps li:hover{background:var(--accent-soft)}
.msteps .mic{font-size:22px}
.mquiz{margin-top:10px}
/* bars */
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:minmax(150px,34%) 1fr;gap:10px;align-items:center;cursor:pointer}
.blab{display:flex;flex-direction:column}.blab .bpic{font-size:22px;float:left}
.blab .en{font-size:12px}
.btrack{position:relative;background:var(--bg);border-radius:8px;height:28px;display:flex;align-items:center}
.bfill{height:100%;border-radius:8px;transition:width .8s}
.btrack b{position:absolute;right:8px;font-size:14px}
/* number tiles */
.numtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.numt{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px 4px}
.numt .nd{font-size:28px;font-weight:800;color:var(--unit);line-height:1.1}
.numt .nw{font-size:13px;font-weight:600}
.numt .nm{font-size:11px;color:var(--muted)}
.numt.hl{border:2px solid var(--unit);background:var(--accent-soft)}
/* alphabet */
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px}
.alet{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:6px 2px;display:flex;flex-direction:column;align-items:center}
.alet b{font-size:26px;color:var(--m)}.alet small{color:var(--muted);font-family:var(--serif)}
.alet.vow b{color:var(--f)}
.accs{margin-top:8px}
/* calendar */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.wday{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:6px 2px;display:flex;flex-direction:column;align-items:center}
.wday b{font-size:18px;text-transform:capitalize;color:var(--unit)}.wday span{font-size:12px}
.wday.we{background:var(--accent-soft)}
.seasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.season{border-radius:12px;padding:8px 10px;color:#1f2a2b}.season .sh{font-weight:700;margin-bottom:4px;cursor:pointer}
.season .schip{background:rgba(255,255,255,.75);color:#1f2a2b}
.season .en{color:#556}
/* timeline */
.tline{position:relative;height:200px;margin:10px 6px}
.tl-axis{position:absolute;left:0;right:0;top:96px;height:6px;border-radius:3px;background:linear-gradient(90deg,#9fb7d6,#f0c419 50%,#9fd6b0);display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted)}
.tl-axis span{margin-top:10px}
.tl-now{position:relative}.tl-now::before{content:"";position:absolute;left:50%;top:-18px;width:3px;height:22px;background:var(--rouge)}
.tl-it{position:absolute;transform:translateX(-50%);width:150px;text-align:center;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-size:14px}
.tl-it.up{top:0}.tl-it.dn{top:122px}
.tl-it .tl-pic{font-size:24px}.tl-it .en{font-size:12px}
/* flags */
.flags{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.flagt{border:1px solid var(--line);border-top:5px solid var(--line);border-radius:12px;background:var(--panel);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.flagt .flag{border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.flagt .ftc{font-weight:700;font-size:14px}.flagt .ftp{font-size:13px;color:var(--accent-2);font-weight:700}.flagt .ftn{font-size:12px;color:var(--muted)}
.ft-m{border-top-color:var(--m)}.ft-f{border-top-color:var(--f)}.ft-pl{border-top-color:var(--pl)}.ft-v{border-top-color:#e0a526}
body:not(.no-gc) .ft-m .ftc{color:var(--m)} body:not(.no-gc) .ft-f .ftc{color:var(--f)} body:not(.no-gc) .ft-pl .ftc{color:var(--pl)}
/* phone / sms */
.phone{width:min(100%,330px);margin:0 auto;background:#ece5dd;border:10px solid #1f2a2b;border-radius:28px;padding:0 10px 14px;display:flex;flex-direction:column;gap:6px}
.ph-top{background:#1f2a2b;color:#fff;margin:0 -10px 6px;padding:4px 0 8px;text-align:center;font-size:13px;font-weight:700}
.smsb{max-width:85%;background:#fff;color:#1f2a2b;border-radius:14px 14px 14px 4px;padding:6px 10px;cursor:pointer;font-size:14px;display:flex;flex-direction:column}
.smsb.me{align-self:flex-end;background:#dcf8c6;border-radius:14px 14px 4px 14px}
.smsb .fr{font-weight:500}.smsb .en{font-size:12px;color:#667}
/* forms / ID cards */
.idform{width:min(100%,460px);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.16);overflow:hidden;background:#fff;color:#1f2a2b}
.idf-head{padding:8px 14px;font-weight:800;letter-spacing:.06em;font-size:13px;display:flex;justify-content:space-between;align-items:center;color:#fff;background:#2b59c3}
.idf-body{display:flex;gap:14px;padding:12px 14px}
.idf-photo{flex:none;background:#eef2f6;border-radius:8px;padding:4px;align-self:flex-start}
.idf-fields{flex:1;display:grid;gap:4px}
.idf-row{display:grid;grid-template-columns:120px 1fr;gap:8px;border-bottom:1px dotted #ccd;cursor:pointer;font-size:14px}
.idf-l{color:#667;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.idf-v{font-weight:700;font-family:var(--serif)}
.idf-mrz{font-family:monospace;font-size:11px;background:#f4f4ee;padding:6px 14px;letter-spacing:.08em;color:#445;word-break:break-all}
.idf-id{background:linear-gradient(135deg,#e7f0fa,#fdf3f4)}.idf-id .idf-head{background:linear-gradient(90deg,#0055a4,#0055a4 33%,#fff 33%,#fff 66%,#ef4135 66%);color:#0b2a5b;text-shadow:0 0 3px #fff}
.idf-badge{border:3px solid var(--unit)}.idf-badge .idf-head{background:var(--unit)}
.idf-fiche .idf-head{background:#5b6b7c}
.idf-web .idf-head{background:#a3407e}
/* atelier & DELF */
.atelier{border-top:5px solid var(--unit)}
.at-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.at-n{flex:none;width:36px;height:36px;border-radius:50%;color:#fff;font-weight:900;display:grid;place-items:center;font-size:18px}
.at-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.at-step{background:var(--bg);border-radius:12px;padding:8px 12px}.at-step ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.at-sh{font-weight:700}
.at-ph{margin-top:10px;font-size:14px}

  // dialogue: { scene, people: {name: kind}, staff: name, sit: [names], phone: [names] }
  function scene(d) {
    const S = SCENES[d.scene] || SCENES.rue;
    const names = Object.keys(d.people);
    const staff = d.staff && d.people[d.staff] ? d.staff : null;
    const others = names.filter(n => n !== staff);
    const actors = [], chairs = [];
    const opt = (n) => ({ outfit: n === staff ? S.outfit : null, oc: S.oc, phone: (d.phone || []).includes(n) || (S.split && n !== staff), sit: (d.sit || []).includes(n) || (S.allSit) || (S.clientSit && n !== staff), wave: (d.wave || []).includes(n), hold: (d.hold || {})[n] });
    const sc = (k, base) => (CAST[k] || {}).child ? base * 0.66 : base;
    if (staff) actors.push(placed(d.people[staff], S.split ? 140 : 170, 256, sc(d.people[staff], 0.92), opt(staff), staff));
    const n = others.length;
    const xs = S.split ? [480, 560] : staff ? (n > 2 ? [380, 470, 560] : n > 1 ? [420, 520] : [460]) : n > 3 ? [100, 250, 400, 550] : n > 2 ? [150, 320, 490] : n > 1 ? [220, 430] : [320];
    others.forEach((nm, i) => {
      const o = opt(nm), sx = xs[i] || 300 + i * 80, k = d.people[nm];
      if (o.sit) { chairs.push(`<rect x="${sx - 25}" y="150" width="50" height="90" rx="8" fill="#3a2a1e"/>`); actors.push(placed(k, sx, 290, sc(k, 0.88), o, nm)); }
      else actors.push(placed(k, sx, 262, sc(k, 0.95), o, nm));
    });
    return `<svg class="scene-svg" viewBox="0 0 640 300" role="img" aria-label="${(d.title || d.titleFr || "scene").replace(/"/g, "")}">${S.back()}${S.allSit ? "" : chairs.join("")}${actors.join("")}${S.front ? S.front() : ""}</svg>`;
  }

  /* ---------- a street plan with places and an animated route ---------- */

  function map(sp) {
    const P = pts => pts.map((q, i) => (i ? "L" : "M") + q[0] + "," + q[1]).join(" ");
    const blocks = `<rect width="400" height="260" fill="#f3efe6"/>` + [...Array(8)].map((_, i) => [...Array(6)].map((_, j) => `<rect x="${i * 52 + 6}" y="${j * 46 + 6}" width="40" height="34" rx="4" fill="#e6dfd0"/>`).join("")).join("");

    const streets = (sp.streets || []).map(st => `<path d="${P(st.p)}" stroke="#fff" stroke-width="${st.w || 12}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`).join("");
    const names = (sp.streets || []).filter(st => st.name).map((st, i) => { const a = st.p[0], b = st.p[st.p.length - 1], vert = Math.abs(b[0] - a[0]) < Math.abs(b[1] - a[1]); const x = (a[0] + b[0]) / 2 + (st.dx || 0), y = (a[1] + b[1]) / 2 + (st.dy || 0);
      return `<text x="${x}" y="${y}" font-size="8.5" fill="#6b6255" text-anchor="middle" dominant-baseline="central" ${vert ? `transform="rotate(-90 ${x} ${y})"` : ""} font-style="italic">${st.name}</text>`; }).join("");

    const here = sp.here ? `<g transform="translate(${sp.here[0]},${sp.here[1]})"><circle r="8" fill="#e0474f"/><circle r="14" fill="none" stroke="#e0474f" stroke-width="2" class="pulse"/><text y="${sp.here[1] > 220 ? -16 : 26}" font-size="9" font-weight="800" text-anchor="middle" fill="#e0474f" paint-order="stroke" stroke="#f3efe6" stroke-width="3">Vous êtes ici</text></g>` : "";
    const rose = `<g transform="translate(22,24)"><circle r="14" fill="#fff" stroke="#999"/><path d="M0,-11 L4,0 0,11 -4,0Z" fill="#2b2118"/><text y="-16" font-size="8" text-anchor="middle">N</text></g>`;
    return `<svg class="map-svg" viewBox="0 0 400 260" role="img" aria-label="plan">${blocks}${parks}${river}${streets}${names}${route}${places}${here}${rose}</svg>`;
  }

  /* ---------- a transit diagram: two lines and a change ---------- */
  // spec: { lines: [{ name, color, stations: [] }, …], from, change, to }
  function metro(sp) {
    const W = 720, out = [], pos = {};
    sp.lines.forEach((ln, li) => {
      const y = 60 + li * 100, x0 = li === 0 ? 130 : (pos[sp.change] ? pos[sp.change][0] : 130), n = ln.stations.length;
      const step = Math.min(160, (W - x0 - 150) / Math.max(1, n - 1)), pw = ln.name.length * 8 + 22;
      out.push(`<rect x="${x0 - pw - 18}" y="${y - 11}" width="${pw}" height="22" rx="11" fill="${ln.color}"/><text x="${x0 - pw / 2 - 18}" y="${y + 5}" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">${ln.name}</text>`);
      out.push(`<path d="M${x0},${y} H${x0 + step * (n - 1)}" stroke="${ln.color}" stroke-width="10" stroke-linecap="round"/>`);
      ln.stations.forEach((st, i) => {
        const x = x0 + step * i, onRoute = (sp.path || []).includes(st);
        if (!(li > 0 && st === sp.change)) pos[st] = [x, y];
        out.push(`<g class="mstation" data-say="${st.replace(/"/g, "")}"><circle cx="${x}" cy="${y}" r="${onRoute ? 9 : 7}" fill="#fff" stroke="${onRoute ? "#1f2a44" : ln.color}" stroke-width="${onRoute ? 4 : 3}"/><text x="${x}" y="${y + 27}" font-size="12.5" font-weight="${onRoute ? 800 : 500}" text-anchor="middle" fill="#1f2a44">${st}</text></g>`);
      });
      if (ln.dir) out.push(`<text x="${x0 + step * (n - 1) + 16}" y="${y + 5}" font-size="12" fill="${ln.color}" font-weight="800">→ ${ln.dir}</text>`);
    });
    if (sp.change && pos[sp.change]) { const [x] = pos[sp.change]; out.push(`<path d="M${x},70 V150" stroke="#1f2a44" stroke-width="3" stroke-dasharray="4 4"/><rect x="${x + 8}" y="98" width="78" height="22" rx="11" fill="#fff" stroke="#1f2a44"/><text x="${x + 47}" y="113" font-size="11.5" text-anchor="middle" font-weight="800">⇄ changez</text>`); }
    if (sp.from && pos[sp.from]) { const [x, yy] = pos[sp.from]; out.push(`<text x="${x}" y="${yy - 16}" font-size="12" text-anchor="middle" font-weight="700">🚶 départ</text>`); }
    return `<svg class="metro-svg" viewBox="0 0 ${W} 210" role="img" aria-label="plan des transports">${out.join("")}</svg>`;
  }

  // an analogue clock face for times: ART.clock(7, 58)
  function clock(hh, mm, sz = 110) {
    const a = (v, max) => (v / max) * 2 * Math.PI - Math.PI / 2;
    const hx = 50 + 24 * Math.cos(a((hh % 12) + mm / 60, 12)), hy = 50 + 24 * Math.sin(a((hh % 12) + mm / 60, 12));
    const mx = 50 + 36 * Math.cos(a(mm, 60)), my = 50 + 36 * Math.sin(a(mm, 60));
    const ticks = [...Array(12)].map((_, i) => { const t = a(i, 12); return `<path d="M${50 + 40 * Math.cos(t)},${50 + 40 * Math.sin(t)} L${50 + 45 * Math.cos(t)},${50 + 45 * Math.sin(t)}" stroke="#2b2118" stroke-width="${i % 3 ? 1.5 : 3}"/>`; }).join("");
    return `<svg class="clock-svg" width="${sz}" height="${sz}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#fff" stroke="#2b2118" stroke-width="3"/>${ticks}<path d="M50,50 L${hx},${hy}" stroke="#2b2118" stroke-width="5" stroke-linecap="round"/><path d="M50,50 L${mx},${my}" stroke="#d62839" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="#2b2118"/></svg>`;
  }

  // a euro coin / note visual for prices
  function money(amount) {
    const e = Math.floor(amount), c = Math.round((amount - e) * 100);

    if (c) out.push(`<span class="coin small">${c}c</span>`);
    return `<span class="money">${out.join("")}</span>`;
  }

  window.ART = { CAST, person, avatar, scene, mini, clock, money, SCENES, flag, FLAGS, map, metro };
})();
</script><script>/* French lesson engine for the Édito A2 interactive course (FrenchDialogues).
   Renders the unit object in window.LESSONS (or an étape bilan in window.TEST).
   Needs art.js (window.ART) loaded first. */
(function () {
  "use strict";
  const T = window.TEST || null;
  const L = T ? testLesson(T) : window.LESSONS[window.LESSONS.length - 1];

    const ls = window.LESSONS, seen = new Set(), tag = (arr, id) => (arr || []).map(x => Object.assign({ src: id }, x));
    return {
      id: t.id, title: t.title, rubrique: t.rubrique, num: 0,

      practice: ls.flatMap(l => tag(l.practice, l.id)),
      dialogues: ls.flatMap(l => (l.dialogues || []).map(d => Object.assign({ src: l.id }, d))),

    };
  }
  const A = window.ART;
  const $ = (s, el = document) => el.querySelector(s);
  const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const BOOK = "Édito A2 · Méthode de français";
  const RUB = { 1: "Parcours et souvenirs", 2: "Chez soi, entre nous", 3: "Demain, à table !", 4: "Santé et médias", 5: "Consommer, voyager", 6: "Travail et nature" };
  const UCOL = ["#2f9c8a", "#c2508e", "#4f9d4f", "#9b4fb0", "#e86a2e", "#2f9c8a", "#e0474f", "#3a6fd8", "#9b4fb0", "#7d9a2e", "#e86a2e", "#3a4f8a", "#4f9d4f"];
  const ucol = n => UCOL[n] || "#0f7b6c";

  /* ---------- storage ---------- */
  const KEY = "french-edito-a2-v1";
  const DEF = { en: true, pr: true, gc: true, rate: 0.9 };
  let S = { lessons: {}, words: {}, prefs: Object.assign({}, DEF) };
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
  S.prefs = Object.assign({}, DEF, S.prefs);
  S.prefs.rate = [0.65, 0.9, 1.05].reduce((a, v) => Math.abs(v - S.prefs.rate) < Math.abs(a - S.prefs.rate) ? v : a, 0.9);
  const LS = S.lessons[L.id] = S.lessons[L.id] || { done: {}, best: {} };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  /* ---------- text helpers ---------- */
  const G = { m: "masculine", f: "feminine", pl: "plural" };
  const fr = (txt, cls = "", g = "") => `<span class="fr ${cls} ${g ? "g-" + g : ""}" lang="fr">${esc(txt)}</span>`;
  // [[texte]] · [[texte|shown]] · [[m:un croissant]] (gender-coloured) inside prose → tappable French
  const tz = (html) => String(html).replace(/\[\[(?:(m|f|pl):)?([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, g, say, show) => `<b class="say ${g ? "g-" + g : ""}" lang="fr" data-say="${esc(say)}">${show || say}</b>`);
  const low = (s) => s.toLocaleLowerCase("fr");
  const norm = (s) => low(String(s)).replace(/[’‘`´]/g, "'").replace(/[.,!?¿;:"“”«»()…\–—]/g, " ").replace(/\s*'\s*/g, "'").replace(/\s+/g, " ").trim();
  const bare = (s) => norm(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/œ/g, "oe");
  // 2 = exact, 1 = right except accents, 0 = wrong

  /* ---------- French numbers, prices and times in words ---------- */

  WIDGETS.prices = (w) => {

        g.innerHTML = `<div class="row" style="justify-content:center"><button class="play big-play" style="margin:0">▶</button><input class="tin" style="width:120px" placeholder="e.g. 12,50" inputmode="decimal"> € <button class="btn small primary">Check</button></div><div class="gfb" style="text-align:center"></div>`;

    const draw = (sayIt, t = ts[i]) => { $(".ck", el).innerHTML = A.clock(t[0], t[1], 120); $(".ck-big", el).textContent = timeStr(t[0], t[1]); $(".ck-words", el).innerHTML = fr(timeWords(t[0], t[1])) + (t[2] ? ` <span class="en">· ${esc(t[2])}</span>` : ""); if (sayIt) speak(timeWords(t[0], t[1])); };

      }
    };

  };


  // numbers: see / hear / type numbers
  WIDGETS.numbers = (w) => {
    const lo = w.min || 0, hi = w.max || 100, rnd = () => lo + Math.floor(Math.random() * (hi - lo + 1));

    const draw = (sayIt) => { $(".pt-num", el).textContent = cur.toLocaleString("fr-FR"); $(".pt-words", el).innerHTML = fr(frNum(cur)); if (sayIt) speak(frNum(cur)); };
    el.onclick = e => {
      const b = e.target.closest("[data-a]"); if (!b) return; const g = $(".pgame", el);
      if (b.dataset.a === "new") { cur = rnd(); draw(true); }

        const say = () => speak(frNum(n), $(".big-play", g)); say(); $(".big-play", g).onclick = say;
        const chk = () => { const v = parseInt($("input", g).value.replace(/\s/g, ""), 10); const ok = v === n; tries++; if (ok) score++; $(".gfb", g).innerHTML = `${ok ? "✓ Bravo !" : "✗"} <b>${n.toLocaleString("fr-FR")}</b> = ${fr(frNum(n))} <span class="muted">· score ${score}/${tries}</span>`; };
        $(".btn.primary", g).onclick = chk; $("input", g).onkeydown = e2 => { if (e2.key === "Enter") chk(); }; $("input", g).focus();
      }
      if (b.dataset.a === "read") {
        const n = rnd(), near = [n + 10, n - 10, n + 1, n - 1, n + 20, n + 2].filter(x => x >= lo && x <= Math.max(hi, n + 20) && x !== n);
        const opts = shuffle([n, ...shuffle([...new Set(near)]).slice(0, 3)]);

  // spelling: the course spells a word, you type it; or type your own name and hear it spelled

      if (a === "mine") { const v = $(".sp-mine", el).value.trim(); if (!v) return; $(".sp-out", el).innerHTML = `<span class="fr" lang="fr">${esc(spellOut(v))}</span>`; speak(spellOut(v), null, 0.75); }

    let cur = make(); const words = x => `${DAYS[x.wd]} ${x.d === 1 ? "premier" : frNum(x.d)} ${MONTHS[x.m]}`;

  // everyday (12-hour) time: neuf heures moins le quart, midi et demi…
  function hourWord(h) { h = ((h % 24) + 24) % 24; if (h === 0) return "minuit"; if (h === 12) return "midi"; const hh = h > 12 ? h - 12 : h; return `${hh === 1 ? "une" : frNum(hh)} heure${hh > 1 ? "s" : ""}`; }
  function timeInformal(h, m) {
    if (m === 0) return `Il est ${hourWord(h)}.`;
    if (m === 15) return `Il est ${hourWord(h)} et quart.`;
    if (m === 30) return `Il est ${hourWord(h)} et ${(h % 12 === 0) ? "demi" : "demie"}.`;
    if (m === 45) return `Il est ${hourWord(h + 1)} moins le quart.`;
    if (m < 30) return `Il est ${hourWord(h)} ${frNum(m).replace(/^un$/, "une").replace(/ et un$/, " et une")}.`;

  WIDGETS.clock12 = (w) => {

    const draw = (sayIt, t = cur) => { cur = t; $(".ck", el).innerHTML = A.clock(t[0], t[1], 120); $(".ck-big", el).textContent = timeStr(t[0], t[1]); $(".ck-words", el).innerHTML = fr(timeInformal(t[0], t[1])); $(".ck-off", el).innerHTML = `official: ${esc(timeWords(t[0], t[1]))}`; if (sayIt) speak(timeInformal(t[0], t[1])); };

      if (a === "hear") speak(timeInformal(cur[0], cur[1]));
      if (a === "game") {
        const t = [1 + Math.floor(Math.random() * 11), [0, 15, 30, 45, 10, 50, 20, 40][Math.floor(Math.random() * 8)]];
        const opts = shuffle([t, [t[0], (t[1] + 30) % 60], [(t[0] % 11) + 1, t[1]], [t[0], 60 - t[1] === 60 ? 15 : 60 - t[1]]].filter((o, i, arr) => arr.findIndex(x => x[0] === o[0] && x[1] === o[1]) === i)).slice(0, 4);

        const say = () => speak(timeInformal(t[0], t[1]), $(".big-play", g)); say(); $(".big-play", g).onclick = say;
        g.onclick = e2 => { const o = e2.target.closest("[data-o]"); if (!o) return; e2.stopPropagation(); const pick = opts[+o.dataset.o], ok = pick[0] === t[0] && pick[1] === t[1]; tries++; if (ok) score++; o.classList.add(ok ? "ok" : "no"); $(".gfb", g).innerHTML = `${ok ? "✓ Exact !" : "✗"} ${fr(timeInformal(t[0], t[1]))} <span class="muted">· score ${score}/${tries}</span>`; g.onclick = null; };

  /* ---------- Ateliers, DELF, Détente ---------- */

  /* ---------- Pour communiquer ---------- */
  const REG = { poli: ["poli", "polite"], std: ["courant", "everyday"], fam: ["familier", "casual"], sout: ["soutenu", "formal"] };
  views.expressions = (m) => {

  /* ---------- Pronunciation ---------- */
  views.sounds = (m) => {
    const sd = L.sounds;
    m.appendChild(secHead("sounds", tz(sd.intro)));
    const g = h(`<div class="stack"></div>`);
    sd.letters.forEach(x => g.appendChild(h(`<div class="card letter"><div class="glyph" data-say="${esc(x.ex[0])}">${esc(x.l)}</div><div><b>${esc(x.name)}</b><p style="margin:4px 0 8px">${tz(x.tip)}</p>${x.ex.map(w => `<span class="ex" data-say="${esc(w)}">${fr(w)}<button class="play" style="width:28px;height:28px;font-size:12px">🔊</button></span>`).join("")}</div></div>`)));
    m.appendChild(g);
    if (sd.pairs && sd.pairs.length) {
      m.appendChild(h(`<h3>Minimal pairs: hear the difference</h3>`));
      const pg = h(`<div class="stack"></div>`);
      sd.pairs.forEach(p => pg.appendChild(h(`<div class="card pair"><div class="side" data-say="${esc(p.a[0])}">${fr(p.a[0])}<div class="en">${esc(p.a[1])}</div></div><div class="vs">${esc(p.note)}<br>vs</div><div class="side" data-say="${esc(p.b[0])}">${fr(p.b[0])}<div class="en">${esc(p.b[1])}</div></div></div>`)));
      m.appendChild(pg);
      m.appendChild(h(`<h3>🎯 Which one did you hear?</h3>`));
      const game = h(`<div class="card" style="text-align:center"><button class="play big-play" id="pg-play">▶</button><div class="row" style="justify-content:center" id="pg-opts"></div><div id="pg-fb" class="muted" style="margin-top:10px">Press play, then choose what you heard.</div><div class="muted" id="pg-score" style="font-size:13px"></div></div>`);
      let cur, right = 0, total = 0;
      const next = () => { const p = sd.pairs[Math.floor(Math.random() * sd.pairs.length)]; cur = { p, pick: Math.random() < .5 ? "a" : "b" }; $("#pg-opts", game).innerHTML = shuffle(["a", "b"]).map(k => `<button class="opt" data-k="${k}">${fr(p[k][0])} <span class="en">${esc(p[k][1])}</span></button>`).join(""); };

  /* ---------- quiz runner ---------- */

        const nb = h(`<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary">Suivant →</button></div>`);
        $("button", nb).onclick = () => { i++; show(); }; body.appendChild(nb); $("button", nb).focus();
      };

  function orderQ(body, it, finish) {

  function matchQ(body, it, finish) {

  function wireKeys(el) { el.addEventListener("click", e => { const k = e.target.closest("[data-ch]"); if (!k) return; const host = k.closest("li,.qbody,.tsec"); const inp = (host && host._last) || (host && host.querySelector("input")); if (!inp || inp.disabled) return; const s = inp.selectionStart ?? inp.value.length; inp.value = inp.value.slice(0, s) + k.dataset.ch + inp.value.slice(inp.selectionEnd ?? s); inp.focus(); inp.setSelectionRange(s + 1, s + 1); }); }

    if (weak.length) { box.appendChild(h(`<h3>Due for review: ${weak.length} words</h3>`)); flash(box, shuffle(weak)); }
    else box.appendChild(h(`<div class="card">🎉 Nothing due: every word is in box 2 or higher. Come back tomorrow, or test yourself in the Activités tab.</div>`));
    const reset = h(`<div style="margin-top:30px"><button class="btn small" id="rs">Reset this unit's progress</button> <span id="rs-c"></span></div>`);
    $("#rs", reset).onclick = () => { $("#rs-c", reset).innerHTML = `Are you sure? <button class="btn small" id="rs-y">Yes, reset</button>`; $("#rs-y", reset).onclick = () => { S.lessons[L.id] = { done: {}, best: {} }; L.vocab.forEach(w => delete S.words[w.t]); save(); location.reload(); }; };
    m.appendChild(reset);
  };

  /* =====================================================================
     TEST PAGES: bilan (fixed test), mastery test, results
     ===================================================================== */
  function initTest() {
    S.tests = S.tests || {};
    const TS = S.tests[T.id] = S.tests[T.id] || { attempts: [] };
    const lessonName = id => { const l = L.lessons.find(x => x.id === id); return l ? `Unité ${l.num} · ${l.titleFr}` : id; };
    const lessonLink = (id, area) => window.COURSE_HOME ? `<a href="${id}.html#${area || "grammar"}">${esc(lessonName(id))} ↗</a>` : esc(lessonName(id));
    const fmt = n => (Math.round(n * 2) / 2).toString();
    document.title = `${T.title} · Édito A2`;
    document.body.innerHTML = header(`${BOOK} · Étape ${T.rubrique} · ${esc(T.pages)}`, esc(T.title), `<button class="chip" id="t-en">EN</button><button class="chip" id="t-gc"><span class="gdot m"></span><span class="gdot f"></span> Genre</button><button class="chip" id="t-rate">🐢 Speed</button>`) + `
      <nav class="tabs" id="tabs"><a href="#book" data-tab="book">📘 Bilan</a><a href="#mastery" data-tab="mastery">🎯 Mastery test</a><a href="#results" data-tab="results">📈 Résultats</a></nav>
    </header><main id="main"></main>
    <footer>Original test covering the units of this étape · answers explained item by item.</footer>`;
    wirePrefs();

    function saveAttempt(a) { TS.attempts.push(Object.assign({ date: new Date().toISOString() }, a)); save(); }
    function weakReport(wrongs) {
      const g = {}; wrongs.forEach(w => { if (!w.lesson) return; g[w.lesson] = g[w.lesson] || { n: 0, areas: new Set() }; g[w.lesson].n++; g[w.lesson].areas.add(w.area || "grammar"); });
      const ids = Object.keys(g).sort((a, b) => g[b].n - g[a].n);
      if (!ids.length) return `<p>🌟 No mistakes. You've mastered these units: on to the next ones!</p>`;
      return `<b>Revise these first:</b><ul>${ids.map(id => `<li>${lessonLink(id, [...g[id].areas][0])} · ${g[id].n} mistake${g[id].n > 1 ? "s" : ""}</li>`).join("")}</ul>`;
    }
    const fbLine = (ok, ans, why) => `${ok ? "✓" : "✗ Answer: " + fr(ans)} <span class="muted">${tz(esc(why || ""))}</span>`;
    const pickTiles = (sec, el, onPick) => { const pick = {}; let locked = false;
      el.addEventListener("click", e => { const b = e.target.closest("[data-j]"); if (!b || locked) return; const i = b.dataset.i; pick[i] = +b.dataset.j;
        el.querySelectorAll(`[data-i="${i}"]`).forEach(x => x.classList.toggle("sel", x === b)); if (onPick) onPick(+i, pick[i]); });
      return { pick, lock() { locked = true; } };
    };
    const markTiles = (el, i, a, p) => el.querySelectorAll(`[data-i="${i}"]`).forEach((x, j) => { if (j === a) x.classList.add("ok"); else if (j === p) x.classList.add("no"); });

    const mixSec = (sec) => Object.assign({}, sec, { items: sec.items.map(it => { const idx = shuffle(it.o.map((_, j) => j)); return Object.assign({}, it, { o: idx.map(j => it.o[j]), a: idx.indexOf(it.a) }); }) });
    const W = {};
    W.match = (sec) => {
      const bs = shuffle(sec.items.map(x => x.b));
      const el = h(`<ol class="titems">${sec.items.map((it, i) => `<li><span class="qsent">${fr(it.a)} → <select data-i="${i}"><option value="">……</option>${bs.map(b => `<option>${esc(b)}</option>`).join("")}</select></span><div class="fb"></div></li>`).join("")}</ol>`);
      return { el, check() {
        let sc = 0; const wrong = [];
        el.querySelectorAll("select").forEach(s => { const it = sec.items[+s.dataset.i], ok = s.value === it.b; s.disabled = true; s.classList.add(ok ? "ok" : "no");
          if (ok) sc++; else wrong.push({ lesson: it.lesson });
          s.closest("li").querySelector(".fb").innerHTML = fbLine(ok, it.b, it.why); });
        return { score: sc * sec.marks / sec.items.length, wrong };
      } };
    };
    W.dialogue = (sec) => {
      sec = mixSec(sec);
      const el = h(`<ol class="titems">${sec.items.map((it, i) => `<li><div class="mini">${it.lines.map(([who, txt]) => `<div><b>${esc(who)} :</b> ${txt === "___" ? `<span class="blank" data-b="${i}">……</span>` : fr(txt)}</div>`).join("")}</div><div class="opts" style="margin-top:6px">${it.o.map((o, j) => `<button class="tile opt-l" data-i="${i}" data-j="${j}">${"abc"[j]}. ${esc(o)}</button>`).join("")}</div><div class="fb"></div></li>`).join("")}</ol>`);
      const P = pickTiles(sec, el, (i, j) => { el.querySelector(`[data-b="${i}"]`).textContent = sec.items[i].o[j]; speak(sec.items[i].o[j]); });
      return { el, check() {
        P.lock(); let sc = 0; const wrong = [];
        sec.items.forEach((it, i) => { const ok = P.pick[i] === it.a; if (ok) sc++; else wrong.push({ lesson: it.lesson });
          markTiles(el, i, it.a, P.pick[i]); el.querySelectorAll("li > .fb")[i].innerHTML = fbLine(ok, it.o[it.a], it.why); });
        return { score: sc * sec.marks / sec.items.length, wrong };
      } };
    };
    W.type = (sec) => {
      const el = h(`<div>${keyRow()}<ol class="titems tgrid">${sec.items.map((it, i) => `<li><span class="qsent">${tz(esc(it.p).replace(/\[\[([^\]]+)\]\]/g, "[[$1]]")).replace("___", `<input class="tin" data-i="${i}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">`)}${it.p.includes("___") ? "" : ` → <input class="tin" data-i="${i}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">`}</span>${it.en ? `<div class="en" style="font-size:13px">${esc(it.en)}</div>` : ""}<div class="fb"></div></li>`).join("")}</ol></div>`);
      el.addEventListener("focusin", e => { if (e.target.matches("input")) el._last = e.target; });
      el.querySelector(".frkeys").addEventListener("click", e => { const k = e.target.closest("[data-ch]"); const inp = el._last; if (!k || !inp || inp.disabled) return; const s = inp.selectionStart ?? inp.value.length; inp.value = inp.value.slice(0, s) + k.dataset.ch + inp.value.slice(inp.selectionEnd ?? s); inp.focus(); inp.setSelectionRange(s + 1, s + 1); });
      return { el, check() {
        let sc = 0; const wrong = [];
        el.querySelectorAll("input").forEach(inp => { const it = sec.items[+inp.dataset.i], ans = it.a.split("|"), j = judge(ans, inp.value), ok = j > 0; inp.disabled = true; inp.classList.add(ok ? "ok" : "no");
          if (ok) sc++; else wrong.push({ lesson: it.lesson });
          inp.closest("li").querySelector(".fb").innerHTML = fbLine(ok, ans[0], (j === 1 ? "watch the accents: " + ans[0] + ". " : "") + (it.why || "")); });
        return { score: sc * sec.marks / sec.items.length, wrong };
      } };
    };
    W.tf = (sec) => {
      const el = h(`<ol class="titems">${sec.items.map((it, i) => `<li><div class="row" style="justify-content:space-between"><span class="qsent">${fr(it.s)} ${playBtn(it.s)}</span><span class="row"><button class="tile" data-i="${i}" data-j="0">✓ Vrai</button><button class="tile" data-i="${i}" data-j="1">✗ Faux</button></span></div>${it.en ? `<div class="en" style="font-size:13px">${esc(it.en)}</div>` : ""}<div class="fb"></div></li>`).join("")}</ol>`);
      const P = pickTiles(sec, el);
      return { el, check() {
        P.lock(); let sc = 0; const wrong = [];
        sec.items.forEach((it, i) => { const a = it.ok ? 0 : 1, ok = P.pick[i] === a; if (ok) sc++; else wrong.push({ lesson: it.lesson });
          markTiles(el, i, a, P.pick[i]); el.querySelectorAll("li > .fb")[i].innerHTML = `${ok ? "✓" : "✗"} <b>${it.ok ? "Vrai" : "Faux"}</b> <span class="muted">${tz(esc(it.why || ""))}</span>`; });
        return { score: sc * sec.marks / sec.items.length, wrong };
      } };
    };
    W.choose = (sec) => {
      sec = mixSec(sec);
      const el = h(`<ol class="titems">${sec.items.map((it, i) => `<li><div class="row" style="justify-content:space-between"><span class="qsent"><b>${esc(it.s)}</b>${it.en ? ` <span class="muted">(${esc(it.en)})</span>` : ""}</span><span class="row">${it.o.map((o, j) => `<button class="tile" data-i="${i}" data-j="${j}">${"abcd"[j]}) ${esc(o)}</button>`).join("")}</span></div><div class="fb"></div></li>`).join("")}</ol>`);
      const P = pickTiles(sec, el, (i, j) => speak(sec.items[i].o[j]));
      return { el, check() {
        P.lock(); let sc = 0; const wrong = [];
        sec.items.forEach((it, i) => { const ok = P.pick[i] === it.a; if (ok) sc++; else wrong.push({ lesson: it.lesson });
          markTiles(el, i, it.a, P.pick[i]); el.querySelectorAll("li > .fb")[i].innerHTML = fbLine(ok, it.o[it.a], it.why); });
        return { score: sc * sec.marks / sec.items.length, wrong };
      } };
    };
    W.listen = (sec) => {
      sec = mixSec(sec);
      const el = h(`<ol class="titems">${sec.items.map((it, i) => `<li><div class="row" style="gap:8px;align-items:center"><button class="btn small" data-play="${i}">▶ Écouter</button><b>${esc(it.q)}</b></div><div class="opts" style="margin-top:6px">${it.o.map((o, j) => `<button class="tile opt-l" data-i="${i}" data-j="${j}">${"abcd"[j]}. ${esc(o)}</button>`).join("")}</div><div class="fb"></div></li>`).join("")}</ol>`);
      const heard = {};
      el.addEventListener("click", e => { const b = e.target.closest("[data-play]"); if (!b) return; const i = +b.dataset.play; heard[i] = (heard[i] || 0) + 1; speak(sec.items[i].say); if (heard[i] >= 2) b.textContent = "▶ Écouter encore"; });
      const P = pickTiles(sec, el);
      return { el, check() {
        P.lock(); let sc = 0; const wrong = [];
        sec.items.forEach((it, i) => { const ok = P.pick[i] === it.a; if (ok) sc++; else wrong.push({ lesson: it.lesson, area: "dialogues" });
          markTiles(el, i, it.a, P.pick[i]); el.querySelectorAll("li > .fb")[i].innerHTML = `${fbLine(ok, it.o[it.a], it.why)}<div class="muted" style="margin-top:4px">📝 ${fr(it.say)}</div>`; });
        return { score: sc * sec.marks / sec.items.length, wrong };
      } };
    };
    const SECNAME = { listen: "Écoutez", match: "Associez", dialogue: "Complétez le dialogue", type: "Écrivez", tf: "Vrai ou faux", choose: "Choisissez" };

    const views = {};
    views.book = (m) => {
      const start = Date.now(), results = {};
      const max = T.sections.reduce((a, s) => a + s.marks, 0);
      m.appendChild(h(`<div><h2>${fr(T.titleFr)}</h2><p class="lead">${tz(esc(T.intro))} The test is out of <b>${max} points</b>.</p></div>`));
      const widgets = [];
      T.sections.forEach((sec, n) => {
        const w = W[sec.type](sec); widgets.push([sec, w]);
        const card = h(`<div class="card tsec" style="margin-bottom:14px"><div class="row" style="justify-content:space-between;align-items:flex-start"><div style="flex:1"><div style="font-size:18px;font-weight:600">${n + 1}. ${fr(sec.instr)}</div><div class="muted" style="font-size:14px">${tz(esc(sec.instrEn))}</div></div><div class="markbox"><span class="got">—</span><span class="of">${sec.marks}</span></div></div><div class="tbody"></div><div class="row" style="justify-content:space-between;margin-top:10px"><span class="secfb muted"></span><button class="btn small chk">Check this section</button></div></div>`);
        if (sec.doc) [].concat(sec.doc).forEach(d => $(".tbody", card).appendChild(infoEl(d)));
        $(".tbody", card).appendChild(w.el);
        const doCheck = () => { if (results[sec.id]) return results[sec.id]; const r = w.check(); results[sec.id] = r;
          $(".got", card).textContent = fmt(r.score); card.classList.add(r.score === sec.marks ? "full" : "part"); $(".chk", card).disabled = true;
          if (sec.explain) $(".secfb", card).innerHTML = "💡 " + tz(esc(sec.explain)); return r; };
        $(".chk", card).onclick = doCheck; w.doCheck = doCheck;
        m.appendChild(card);
      });
      const fin = h(`<div class="card" style="text-align:center"><button class="btn primary" id="finish">Finish &amp; save my score</button><div id="summary"></div></div>`);
      m.appendChild(fin);
      $("#finish", fin).onclick = () => {
        const rs = widgets.map(([sec, w]) => [sec, w.doCheck()]);
        const total = rs.reduce((a, [, r]) => a + r.score, 0), wrong = rs.flatMap(([, r]) => r.wrong);
        const pct = Math.round(100 * total / max);
        saveAttempt({ mode: "book", score: total, max, pct, secs: Math.round((Date.now() - start) / 1000), weak: wrong.map(w => w.lesson) });
        $("#finish", fin).remove();
        $("#summary", fin).innerHTML = `<div class="score">${fmt(total)} / ${max}</div><p>${pct >= 90 ? "Excellent ! 🌟 You're ready for the next units." : pct >= 70 ? "Très bien 👍 Revise the units below, then retake the test." : "Revise the words and practise a bit more before moving on 💪"}</p>
          <table class="g" style="max-width:420px;margin:0 auto 12px">${rs.map(([sec, r], i) => `<tr><td>${i + 1}. ${SECNAME[sec.type] || sec.type}</td><td style="text-align:right"><b>${fmt(r.score)}</b> / ${sec.marks}</td></tr>`).join("")}</table>
          <div style="text-align:left">${weakReport(wrong)}</div><button class="btn" id="retake">↻ Retake the bilan</button> <a class="btn" href="#mastery" style="text-decoration:none">🎯 Try the mastery test</a>`;
        $("#retake", fin).onclick = () => route();
      };
      if (T.selfCheck) m.appendChild(h(`<div class="card" style="margin-top:14px"><b>Auto-évaluation · self-assessment</b><p class="muted" style="font-size:14px">Can you do these in French? Rate yourself from 1 (not yet) to 5 (easily).</p><ol>${T.selfCheck.map(s => `<li>${fr(s[0])} <span class="muted">· ${esc(s[1])}</span></li>`).join("")}</ol></div>`));
    };
    views.mastery = (m) => {
      m.appendChild(h(`<div><h2>🎯 Mastery test</h2><p class="lead">A fresh mix of about 30 questions every time, drawn from <b>all ${L.lessons.length} units</b> this test covers: vocabulary both ways, listening, gender, grammar, sentence building and dialogues. Your mistakes also go into each word's spaced-review deck.</p>
        <div class="card"><b>Covers:</b><ul>${L.lessons.map(l => `<li>${lessonLink(l.id, "overview")}</li>`).join("")}</ul><button class="btn primary" id="go">Start a new mastery test</button></div></div>`));
      $("#go", m).onclick = () => {
        m.innerHTML = ""; const start = Date.now();
        const all = L.dialogues.flatMap(d => d.lines.filter(l => d.people[l[0]]).map(l => ({ l, src: d.src }))).filter(x => x.l[1].length > 8);
        const lines = shuffle(all).slice(0, 4).map(({ l, src }) => {
          const others = shuffle([...new Set(all.map(x => x.l[2]).filter(t => t !== l[2]))]).slice(0, 3);
          const o = shuffle([l[2], ...others]); return { type: "listen", say: l[1], options: o, answer: o.indexOf(l[2]), src, area: "dialogues" };
        });
        const prac = shuffle(L.practice).slice(0, 12).map(x => Object.assign({ area: "practice" }, x));
        const gen = genderItems(3).map(x => Object.assign({ src: x.word.src, area: "vocabulary" }, x));
        const items = shuffle([...vocabMCQ(5, "fr2en"), ...vocabMCQ(3, "en2fr"), ...vocabMCQ(3, "listen"), ...gen, ...lines, ...prac]);
        runQuiz(m, items, T.id + "-mastery", (pct, wrongItems, sc, n) => {
          saveAttempt({ mode: "mastery", score: sc, max: n, pct, secs: Math.round((Date.now() - start) / 1000), weak: wrongItems.map(w => w.src) });
          m.appendChild(h(`<div class="card" style="margin-top:14px">${weakReport(wrongItems.map(w => ({ lesson: w.src, area: w.area })))}<button class="btn primary" id="again">New mastery test</button></div>`));
          $("#again", m).onclick = () => route();
        });
      };
    };
    views.results = (m) => {
      const at = TS.attempts.slice().reverse();
      const best = mode => { const xs = TS.attempts.filter(a => a.mode === mode); return xs.length ? Math.max(...xs.map(a => a.pct)) + "%" : "—"; };
      m.appendChild(h(`<div><h2>📈 Résultats</h2><p class="lead">Your attempts are saved in this browser. Aim for 90% or more on both tests before moving on.</p>
        <div class="grid" style="margin-bottom:16px"><div class="card"><div class="muted">Best bilan</div><div class="score" style="font-size:36px;text-align:left">${best("book")}</div></div>
        <div class="card"><div class="muted">Best mastery test</div><div class="score" style="font-size:36px;text-align:left">${best("mastery")}</div></div>
        <div class="card"><div class="muted">Attempts</div><div class="score" style="font-size:36px;text-align:left">${TS.attempts.length}</div></div></div>
        ${at.length ? `<div class="card" style="overflow-x:auto"><table class="g"><tr><th>Date</th><th>Test</th><th>Score</th><th></th><th>Time</th></tr>${at.map(a => `<tr><td>${new Date(a.date).toLocaleString()}</td><td>${a.mode === "book" ? "📘 Bilan" : "🎯 Mastery"}</td><td><b>${a.mode === "book" ? fmt(a.score) : a.score} / ${a.max}</b></td><td style="width:35%"><div class="qbar" style="margin:0"><div style="width:${a.pct}%;background:${a.pct >= 90 ? "var(--good)" : a.pct >= 70 ? "var(--accent)" : "var(--bad)"}"></div></div></td><td>${Math.floor(a.secs / 60)}m ${a.secs % 60}s</td></tr>`).join("")}</table></div>
        <div class="card" style="margin-top:14px"><b>From your latest attempt:</b> ${weakReport((at[0].weak || []).map(l => ({ lesson: l })))}</div>` : `<div class="card">No attempts yet. Start with the <a href="#book">📘 Bilan</a>.</div>`}</div>`));
    };
    function route() {
      const id = (location.hash || "#book").slice(1), v = views[id] ? id : "book";
      document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("active", a.dataset.tab === v));
      if (synth) synth.cancel();
      const m = $("#main"); m.innerHTML = ""; m.appendChild(voiceBanner()); pickVoice(); views[v](m); window.scrollTo(0, 0);
    }
    route(); window.addEventListener("hashchange", route);
  }

  // exposed for the build-time self-test (node)
  window.FR_HELPERS = { frNum, priceWords, timeWords, timeInformal, contract, artFor, plOf, judge };
  if (typeof document === "undefined" || !document.body) return;
  if (T) initTest();
  else { renderShell(); updateProgress(); route(); window.addEventListener("hashchange", route); }
})();
</script></body></html>
